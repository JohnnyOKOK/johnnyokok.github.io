<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>极简黑白时钟台历</title>
    <!-- 引入开源精准农历库 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lunar-javascript/1.6.12/lunar.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: #000000; /* 极致纯黑 */
            color: #ffffff;           /* 极致纯白 */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 4vh 6vw;
            position: relative;
        }

        /* ------------------ 左侧/顶部日期防挤压容器 ------------------ */
        .top-row-wrapper {
            width: 100%;
            container-type: inline-size;
        }

        .top-row {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
        }

        .date-info {
            font-size: clamp(1.4rem, 8.5cqw, 2.8rem); 
            font-weight: bold;
            white-space: nowrap;
        }

        .lunar-info {
            font-size: clamp(0.95rem, 5.2cqw, 1.6rem);
            line-height: 1.5;
            white-space: nowrap;
            opacity: 0.85; /* 让农历稍微柔和一点，分清主次 */
        }

        /* ------------------ 右侧/主时间防挤压容器 ------------------ */
        .time-box-wrapper {
            flex: 1;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            container-type: inline-size;
        }

        .time-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 1vh;
            width: 100%;
            white-space: nowrap; 
        }

        .time-unit {
            display: flex;
            align-items: baseline;
            justify-content: center;
            line-height: 0.9;
        }

        .time-num {
            font-size: clamp(3.5rem, 25cqw, 11rem); 
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            letter-spacing: -2px;
        }

        .time-label {
            font-size: clamp(0.9rem, 5cqw, 1.8rem); 
            margin-left: 6px;
            margin-right: 6px;
            font-weight: bold;
        }

        /* 手动刷新按钮：同步为纯白简约风格 */
        .btn-refresh-svg {
            position: absolute;
            right: 6vw;
            top: 4.5vh;
            width: 100px;
            height: 36px;
            cursor: pointer;
            z-index: 10;
            transition: transform 0.1s ease;
        }
        
        .btn-refresh-svg:active { 
            transform: scale(1.08); 
        }

        /* 防烧屏纯白线条动画（依然保留，用于保护屏幕） */
        .anti-burn-line {
            position: absolute;
            top: 0;
            left: -10px;
            width: 6px;
            height: 100%;
            background: linear-gradient(to right, rgba(255,255,255,0), rgba(255,255,255,0.95), rgba(255,255,255,0));
            box-shadow: 0 0 15px #ffffff;
            z-index: 9999;
            pointer-events: none;
        }

        @keyframes sweep {
            0% { left: -20px; }
            100% { left: 105vw; }
        }

        .trigger-sweep {
            animation: sweep 1s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        /* ================= 横屏下的比例精细适配 ================= */
        @media (orientation: landscape) {
            body {
                flex-direction: row;
                align-items: center;
                padding: 0 6vw;
            }
            
            .top-row-wrapper { 
                width: 32%; 
            }
            
            .time-box-wrapper {
                width: 68%;
            }

            .time-container { 
                flex-direction: row; 
                justify-content: flex-end;
                gap: 0;
            }
            
            .time-unit {
                align-items: baseline;
            }
            
            .date-info {
                font-size: clamp(1.4rem, 11cqw, 2.6rem); 
            }
            .lunar-info {
                font-size: clamp(0.95rem, 6.5cqw, 1.5rem); 
            }
            .time-num { 
                font-size: clamp(3.5rem, 13cqw, 9.5rem); 
            }
            .time-label {
                font-size: clamp(0.9rem, 3cqi, 1.6rem);
            }
            
            .btn-refresh-svg { top: auto; bottom: 5vh; right: 6vw; }
        }
    </style>
</head>
<body>

    <!-- 防烧屏白线 -->
    <div id="burn-line" class="anti-burn-line"></div>

    <!-- 顶部/左侧信息自适应盒 -->
    <div class="top-row-wrapper">
        <div class="top-row">
            <div id="date-display" class="date-info">--月--日 周几</div>
            <div id="lunar-display" class="lunar-info">农历计算中...</div>
        </div>
    </div>

    <!-- 主时间高自适应盒 -->
    <div class="time-box-wrapper">
        <div class="time-container">
            <div class="time-unit">
                <span id="hour-num" class="time-num">00</span>
                <span class="time-label">时</span>
            </div>
            <div class="time-unit">
                <span id="min-num" class="time-num">00</span>
                <span class="time-label">分</span>
            </div>
            <div class="time-unit">
                <span id="sec-num" class="time-num">00</span>
                <span class="time-label">秒</span>
            </div>
        </div>
    </div>

    <!-- 手动刷新按钮：纯白边框与纯白文字 -->
    <svg class="btn-refresh-svg" onclick="refreshAll()" viewBox="0 0 100 36">
        <rect x="1" y="1" width="98" height="34" rx="17" ry="17" fill="none" stroke="#ffffff" stroke-width="2" />
        <text x="50" y="22" font-size="12" font-weight="bold" font-family="sans-serif" fill="#ffffff" text-anchor="middle">手动刷新</text>
    </svg>

    <script>
        // 1. 24小时制时钟核心
        function updateClock() {
            const now = new Date();
            
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            
            document.getElementById('hour-num').textContent = hours;
            document.getElementById('min-num').textContent = minutes;
            document.getElementById('sec-num').textContent = seconds;

            const month = now.getMonth() + 1;
            const date = now.getDate();
            const weekDays = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
            const dayOfWeek = weekDays[now.getDay()];
            document.getElementById('date-display').textContent = `${month}月${date}日 ${dayOfWeek}`;
            
            if (document.getElementById('lunar-display').textContent.includes("计算中") || (hours === "00" && minutes === "00" && seconds === "00")) {
                updateLunar();
            }
        }

        // 2. 精准农历生成
        function updateLunar() {
            try {
                if (typeof Lunar !== 'undefined') {
                    const d = Lunar.fromDate(new Date());
                    const formatResult = `农历 ${d.getMonthInChinese()}月${d.getDayInChinese()}<br>${d.getYearInGanZhi()} [${d.getYearShengXiao()}] 年 ${d.getMonthInGanZhi()}月 ${d.getDayInGanZhi()}日`;
                    document.getElementById('lunar-display').innerHTML = formatResult;
                } else {
                    // 如果外部库未加载完成，先用公历兜底显示，不卡死脚本
                    document.getElementById('lunar-display').textContent = "正在获取农历...";
                }
            } catch(e) {
                document.getElementById('lunar-display').textContent = "农历暂不可用";
            }
        }

        // 3. 10秒一次的防烧屏白线
        const burnLine = document.getElementById('burn-line');
        setInterval(() => {
            burnLine.classList.remove('trigger-sweep');
            void burnLine.offsetWidth; 
            burnLine.classList.add('trigger-sweep');
        }, 10000); 

        // 4. 自动/手动刷新
        function refreshAll() {
            window.location.reload();
        }

        setInterval(refreshAll, 3600000);
        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
