<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>手机日历</title>
    <style>
        /* 全黑背景，基础文字浅灰色 #cccccc */
        html, body {
            margin: 0;
            padding: 0;
            background-color: #000000;
            color: #cccccc;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            
            /* 核心修改：整体右移回调至 25 像素，完美贴合刘海屏和挖孔边缘 */
            padding-left: 25px;
            box-sizing: border-box; /* 确保内边距不会撑大整个页面的宽度 */
        }

        /* 防烧屏：每10秒黑白竖线扫屏2秒 */
        body::before, body::after {
            content: "";
            position: fixed;
            top: 0;
            width: 4px;
            height: 100%;
            z-index: 9999;
            pointer-events: none;
            opacity: 0;
            animation: sweepLines 10s linear infinite;
        }
        body::before {
            background: #ffffff; /* 刷屏白线保持亮度以达到通刷像素效果 */
            left: -10px;
        }
        body::after {
            background: #222222; /* 灰黑线紧跟其后 */
            left: -20px;
            animation-delay: 0.1s;
        }

        @keyframes sweepLines {
            0%, 80% { left: -50px; opacity: 0; }      /* 前8秒：隐形埋伏在左侧外 */
            81% { opacity: 0.8; }                     /* 第8.1秒：开始刷屏，线变亮 */
            99% { left: 105%; opacity: 0.8; }         /* 到第10秒：横扫到屏幕右侧外 */
            100% { left: 105%; opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- 第1行：公历与农历干支 -->
    <div id="calendar-header">加载中...</div>

    <!-- 第2行：天气与时间并排 -->
    <div>
        <!-- 天气区域 -->
        <div style="display: inline-block; vertical-align: middle;">
            <iframe scrolling="no" width="90" height="80" src="https://i.tianqi.com/?c=code&a=getcode&id=85&icon=1" frameborder="0"></iframe>
        </div>
        
        <!-- 时间区域：时、分数字也同步为温和的浅灰色 #cccccc -->
        <span id="live-time" style="display: inline-block; vertical-align: middle; margin-left: 2vw; font-size: 11vw;">
            <b id="t-hour" style="color: #cccccc;">00</b><span style="font-size: 0.25em; font-weight: normal;">时</span><b id="t-minute" style="color: #cccccc;">00</b><span style="font-size: 0.25em; font-weight: normal;">分</span><span id="t-second" style="font-size: 0.8em; color: #888888;">00</span><span style="font-size: 0.25em; font-weight: normal;">秒</span>
        </span>
    </div>

    <!-- 第3行：宜忌 -->
    <div>
        <span style="color: #52c41a; font-weight: bold;">宜：</span><span id="yi-text" style="color: #52c41a;">加载中...</span>
    </div>
    <div>
        <span style="color: #ff4d4f; font-weight: bold;">忌：</span><span id="ji-text" style="color: #ff4d4f;">加载中...</span>
    </div>

    <!-- 引入本地农历计算库 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lunar-javascript/1.6.12/lunar.js"></script>

    <script>
        function updateCalendar() {
            const now = new Date();

            // 1. 获取公历数据并定制样式
            const month = now.getMonth() + 1;
            const date = now.getDate();
            const dayOfWeekChar = ["日", "一", "二", "三", "四", "五", "六"][now.getDay()];

            // 样式定制：字号加大的同时，基础文字均继承 body 的 #cccccc 浅灰色
            const monthHtml = `<span style="font-size: 2.5em; font-weight: bold;">${month}</span>月`;
            const dateHtml = `<b style="font-size: 3.0em; color: #ff9900;">${date}</b>日`;
            const weekHtml = `<span style="font-size: 2.5em; margin-left: 12px; font-weight: bold;">周<span style="color: #1890ff;">${dayOfWeekChar}</span></span>`;
            
            // 拼接公历 HTML
            const solarHtml = `${monthHtml}${dateHtml}${weekHtml}`;

            // 2. 获取农历与宜忌数据
            let lunarText = "";
            try {
                const d = Lunar.fromDate(now);
                
                const lunarMonth = d.getMonthInChinese();
                const lunarDay = d.getDayInChinese();
                const yearGanZhi = d.getYearInGanZhiByLiChun();
                const yearShengXiao = d.getYearShengXiaoByLiChun();
                const monthGanZhi = d.getMonthInGanZhi();
                const dayGanZhi = d.getDayInGanZhi();
                
                // 农历文本部分前置一个带稍微暗淡一点灰色的样式（#aaaaaa），让第一行的公历和农历更有层次感
                lunarText = `<span style="color: #aaaaaa;"> 农历 ${lunarMonth}月${lunarDay} · ${yearGanZhi}[${yearShengXiao}]年 · ${monthGanZhi}月 ${dayGanZhi}日</span>`;

                const yiList = d.getDayYi();
                const jiList = d.getDayJi();
                document.getElementById('yi-text').innerText = yiList.length > 0 ? yiList.join(' ') : '诸事不宜';
                document.getElementById('ji-text').innerText = jiList.length > 0 ? jiList.join(' ') : '诸事不忌';

            } catch (e) {
                lunarText = `<span style="color: #888888;"> 农历加载失败</span>`;
                document.getElementById('yi-text').innerText = "加载失败";
                document.getElementById('ji-text').innerText = "加载失败";
            }

            // 3. 组合第一行的 HTML 代码
            document.getElementById('calendar-header').innerHTML = solarHtml + lunarText;

            // 4. 处理时间精确填入各标签
            document.getElementById('t-hour').innerText = String(now.getHours()).padStart(2, '0');
            document.getElementById('t-minute').innerText = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('t-second').innerText = String(now.getSeconds()).padStart(2, '0');
        }

        // 初始化并启动每秒时间更新
        updateCalendar();
        setInterval(updateCalendar, 1000);

        // 每隔 1 小时自动强刷一次网页
        setInterval(function() {
            window.location.reload();
        }, 3600000);
    </script>
</body>
</html>
