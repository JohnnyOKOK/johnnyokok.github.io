<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<title>相框排列</title>


<style>


html,body{

    margin:0;

    width:100%;

    height:100%;

    overflow:hidden;

    background:#eeeeee;

    touch-action:none;

}




/* 控制区域 */

#control{

    position:fixed;

    top:10px;

    left:10px;

    z-index:9999;

    background:white;

    padding:10px 15px;

    border-radius:8px;

    box-shadow:0 0 10px #999;

}




button{

    padding:6px 12px;

    cursor:pointer;

}





#scaleSlider{

    width:160px;

    vertical-align:middle;

}





#canvas{

    position:relative;

    width:100%;

    height:100%;

}





/* 背景 */

#background{


    position:absolute;


    z-index:1;


    left:50%;


    top:50%;


    transform:translate(-50%,-50%);


    max-width:100%;


    max-height:100%;


    object-fit:contain;


    user-select:none;


    pointer-events:none;


}






/* 相框 */

.photo{


    position:absolute;


    z-index:2;


    cursor:move;


    user-select:none;


    -webkit-user-drag:none;


    touch-action:none;


    transform-origin:center center;


}



</style>


</head>



<body>




<div id="control">


<button id="backgroundButton">
切换背景
</button>



相框缩放


<input id="scaleSlider"
       type="range"
       min="20"
       max="200"
       value="100">


<span id="scaleText">
100%
</span>


</div>







<div id="canvas">



<img id="background"
src="img/beijing1.jpg">





<img class="photo" src="img/heng1.jpg">

<img class="photo" src="img/heng2.jpg">

<img class="photo" src="img/heng3.jpg">

<img class="photo" src="img/heng4.jpg">

<img class="photo" src="img/heng5.jpg">

<img class="photo" src="img/heng6.jpg">

<img class="photo" src="img/heng7.jpg">





<img class="photo" src="img/shu1.jpg">

<img class="photo" src="img/shu2.jpg">

<img class="photo" src="img/shu3.jpg">

<img class="photo" src="img/shu4.jpg">

<img class="photo" src="img/shu5.jpg">

<img class="photo" src="img/shu6.jpg">

<img class="photo" src="img/shu7.jpg">



</div>








<script>


let photos =
document.querySelectorAll(".photo");


let active=null;


let offsetX=0;


let offsetY=0;





/*
初始化位置
*/

photos.forEach((img,index)=>{


    img.style.left =
    (50+index*50)+"px";


    img.style.top =
    (50+index*40)+"px";




    img.addEventListener(
        "mousedown",
        startDrag
    );


    img.addEventListener(
        "touchstart",
        startDrag,
        {passive:false}
    );


});








/*
开始拖动
*/

function startDrag(e){


    active=this;


    this.style.zIndex =
    Date.now();




    let point;


    if(e.touches){

        point=e.touches[0];

    }else{

        point=e;

    }




    offsetX =
    point.clientX-this.offsetLeft;


    offsetY =
    point.clientY-this.offsetTop;



    e.preventDefault();


}







/*
移动
*/


document.addEventListener(
"mousemove",
moveDrag
);


document.addEventListener(
"touchmove",
moveDrag,
{passive:false}
);



function moveDrag(e){



    if(active){



        let point;



        if(e.touches){

            point=e.touches[0];

        }else{

            point=e;

        }





        active.style.left =
        (point.clientX-offsetX)+"px";



        active.style.top =
        (point.clientY-offsetY)+"px";



        e.preventDefault();


    }


}








/*
结束拖动
*/


document.addEventListener(
"mouseup",
endDrag
);


document.addEventListener(
"touchend",
endDrag
);



function endDrag(){


    active=null;


}









/*
缩放
*/


let slider =
document.getElementById("scaleSlider");


let scaleText =
document.getElementById("scaleText");



slider.oninput=function(){



    let scale =
    this.value/100;



    photos.forEach(img=>{


        img.style.transform =
        "scale("+scale+")";


    });



    scaleText.innerHTML =
    this.value+"%";


};










/*
切换背景
*/


let background =
document.getElementById("background");


let backgroundButton =
document.getElementById("backgroundButton");



let bg=1;



backgroundButton.onclick=function(){



    if(bg==1){


        background.src =
        "img/beijing2.jpg";


        bg=2;


    }else{


        background.src =
        "img/beijing1.jpg";


        bg=1;


    }


};




</script>


</body>

</html>
